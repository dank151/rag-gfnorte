services:
  - type: web
    name: rag-gfnorte
    runtime: python
    plan: free
    region: virginia
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: BASE_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: APP_TOKEN
        sync: false
      - key: MAX_LLAMADAS
        value: "20"